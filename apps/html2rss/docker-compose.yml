services:
  html2rss:
    image: html2rss/web:1.12.2
    environment:
      RACK_ENV: production
      PORT: 4000
      HTML2RSS_SECRET_KEY: ${HTML2RSS_SECRET_KEY}
      HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN}
      HTML2RSS_TOTAL_TIMEOUT_SECONDS: 25
      RACK_TIMEOUT_SERVICE_TIMEOUT: 30
      BOTASAURUS_SCRAPER_URL: http://botasaurus:4010
    depends_on:
      botasaurus:
        condition: service_started
    restart: unless-stopped
    x-runtipi:
      is_main: true
      internal_port: 4000

  botasaurus:
    image: html2rss/botasaurus-scrape-api:4be0dd14d8377af19936a090a716ff8a8bc1a0c6
    restart: unless-stopped

x-runtipi:
  schema_version: 2
