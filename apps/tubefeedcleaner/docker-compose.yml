services:
  tubefeedcleaner:
    image: ghcr.io/rodrigomescua/tubefeedcleaner:1.0.0
    restart: unless-stopped
    init: true
    environment:
      - TZ=${TZ}
      - PORT=8080
      - INTERVAL_MINUTES=30
      - CHROME_PROFILE=/data/chrome/cleaner-profile
    volumes:
      - ${APP_DATA_DIR}/data/data:/app/data
      - ${APP_DATA_DIR}/data/chrome:/data/chrome
    shm_size: 1gb
    x-runtipi:
      is_main: true
      internal_port: 8080

x-runtipi:
  schema_version: 2
