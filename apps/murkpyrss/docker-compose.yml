services:
  murkpyrss:
    image: ghcr.io/rodrigomescua/murkpyrss:202608051905
    restart: always
    environment:
      - TZ=${TZ}
      - IS_TOP=${IS_TOP}
      - EXTRACTOR_RUNNER_IMAGE=ghcr.io/rodrigomescua/murkpyrss-extractor-runner:latest
    volumes:
      - ${APP_DATA_DIR}/data/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    x-runtipi:
      is_main: true
      internal_port: 8000

x-runtipi:
  schema_version: 2
