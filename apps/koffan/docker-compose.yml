services:
  koffan:
    image: ghcr.io/pansalut/koffan:v2.13.0
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
    environment:
      - APP_ENV=production
      - APP_PASSWORD=${KOFFAN_APP_PASSWORD}
      - PORT=8080
      - DB_PATH=/data/shopping.db
      - DEFAULT_LANG=${KOFFAN_DEFAULT_LANG:-pt}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:$${PORT}/login || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    x-runtipi:
      is_main: true
      internal_port: 8080

x-runtipi:
  schema_version: 2
