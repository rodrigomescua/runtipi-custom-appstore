x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/securo
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: "false"
  FRONTEND_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
  WEBAUTHN_RP_NAME: Securo
  WEBAUTHN_RP_ID: ${APP_DOMAIN}
  WEBAUTHN_ORIGIN: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
  LOCAL_AUTH_ENABLED: "true"
  TRUSTED_PROXY_HOPS: "1"
  REDIS_URL: redis://redis:6379/0
  STORAGE_LOCAL_PATH: /app/data/attachments
  AGENTS_KNOWLEDGE_STORAGE_PATH: /app/data/agent_knowledge
  AGENTS_ENABLED: "false"
  AGENTS_BUILTIN_MCP_URL: http://mcp-server:8765/mcp
  AGENTS_MCP_JWT_SECRET: ${AGENTS_MCP_JWT_SECRET}
  AGENTS_DEFAULT_PROVIDER: ollama
  AGENTS_EMBEDDING_PROVIDER: native
  FX_SYNC_MODE: on_demand
  TESOURO_DIRETO_ENABLED: "true"
  PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
  PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
  PLUGGY_OAUTH_REDIRECT_URI: ${PLUGGY_OAUTH_REDIRECT_URI:-}
  ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
  ENABLE_BANKING_PRIVATE_KEY_FILE: /app/secrets/enable_banking_private.pem
  ENABLE_BANKING_API_URL: https://api.enablebanking.com
  ENABLE_BANKING_OAUTH_REDIRECT_URI: ${ENABLE_BANKING_OAUTH_REDIRECT_URI:-}
  SIMPLEFIN_ENABLED: ${SIMPLEFIN_ENABLED:-false}
  SIMPLEFIN_API_URL: https://beta-bridge.simplefin.org
  OPENEXCHANGERATES_APP_ID: ${OPENEXCHANGERATES_APP_ID:-}

x-backend-volumes: &backend-volumes
  - ${APP_DATA_DIR}/data/attachments:/app/data/attachments
  - ${APP_DATA_DIR}/data/agent_knowledge:/app/data/agent_knowledge
  - ${APP_DATA_DIR}/data/embedding_models:/app/data/embedding_models
  - ${APP_DATA_DIR}/data/secrets:/app/secrets:ro

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: securo
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securo"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/securo-finance/securo-backend:0.16.3
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    environment: *backend-environment
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    image: ghcr.io/securo-finance/securo-backend:0.16.3
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    restart: unless-stopped
    environment: *backend-environment
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: ghcr.io/securo-finance/securo-backend:0.16.3
    command: celery -A app.worker beat --loglevel=info
    restart: unless-stopped
    environment: *backend-environment
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes: *backend-volumes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/securo-finance/securo-frontend:0.16.3
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: ${APP_PROTOCOL:-http}://${APP_DOMAIN}
    depends_on:
      - backend
    x-runtipi:
      is_main: true
      internal_port: 8080

x-runtipi:
  schema_version: 2
